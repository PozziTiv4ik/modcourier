name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Compile
        run: python -m compileall -q modcourier.py src scripts tests
      - name: Test real CLI and local HTTP contracts
        run: python -m unittest discover -s tests -v
      - name: Build standalone application
        run: python scripts/build_release.py
      - name: Verify standalone application
        run: python dist/modcourier.pyz --version
